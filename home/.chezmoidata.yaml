# The feature catalogue: the single source of truth for what gets installed.
#
# It is read TWICE, which is not duplication but a way around a chezmoi
# ordering constraint:
#
#   * .chezmoi.toml.tmpl reads this file via
#     `include ".chezmoidata.yaml" | fromYaml`, because the config template is
#     rendered BEFORE chezmoi loads .chezmoidata.*, so `.features` is not
#     reachable from there;
#   * every other template gets it natively as `.features`.
#
# Fields:
#   key      Identifier. This is what is stored in chezmoi.toml (data.enabled)
#            and what .chezmoiignore and the scripts branch on. Renaming a key
#            discards the user's saved selection; editing a label does not.
#   label    Description shown in the install checklist. Free to reword.
#   scope    both | host | container -- where the feature makes physical sense.
#            Anything not tied to hardware or to a desktop session belongs in
#            both: neovim and vscode are equally wanted in either place.
#   always   true -> never ask, always install (within its scope).
#   default  true -> pre-selected in the checklist.
#   needs    Other features, pulled in automatically; no need to ask for them.
#   pacman   Packages from the official repositories.
#   aur      Packages from the AUR (installed with yay, which is built on demand).
#   npm      Global npm packages (they land in ~/.npm-global).
#   dotnet   Global dotnet tools (they land in ~/.dotnet/tools).
#
# The order of features here is the order of lines in the checklist.

# Bookmarks placed in every context's toolbar folder, with that context baked
# into the link. Shared addresses belong here rather than in an "Always Open in
# Container" rule: a domain rule PULLS a link into one container, so a rule on
# teams.microsoft.com for one job would swallow the sign-in for another. A
# bookmark carries its container and pulls nothing.
#
# Per-context additions go under `bookmarks` on the context itself.
bookmarks:
  - title: Teams
    url: https://teams.microsoft.com
  - title: Azure DevOps
    url: https://dev.azure.com
  - title: GitHub
    url: https://github.com

# Второй механизм закладок, отдельный от `bookmarks:` выше, и разница между ними
# не косметическая.
#
# `bookmarks:` это политика Bookmarks: настоящие закладки на панели. Сверка идёт
# ПО АДРЕСУ и умеет только добавить и удалить, шага "обновить" в
# BookmarksPolicies.sys.mjs:101-185 нет вовсе. Поэтому переименование и перенос в
# другую папку выживают, удаление отменяется возвратом закладки при следующем
# запуске, а исчезновение строки отсюда убирает закладку из браузера. Личные
# закладки не затрагиваются: у наших префикс guid PolB-, у папок PolF-.
#
# `managed_bookmarks:` это политика ManagedBookmarks: не закладки, а отдельная
# кнопка-меню на панели, которая читается из политики при каждом старте. Трогать
# нечего, зато вложенность любой глубины -- единственное, чего Bookmarks не умеет
# (там ровно один уровень папок).
#
# Форма ниже это форма самой политики, чтобы не изобретать второй язык описания:
# элемент с `toplevel_name` задаёт имя кнопки, остальные это узлы с `name` и
# `url` либо `name` и `children`. Единственное наше добавление -- необязательное
# поле `context` рядом с `url`: оно превращает ссылку в ext+container:, то есть
# вшивает контейнер в саму ссылку. Опечатка в нём валит apply, и это сделано
# нарочно: расширение СОЗДАЁТ контейнер под ненайденное имя, и создаёт его без
# прокси, так что закладка с опечаткой выглядела бы рабочей и выходила бы в сеть
# напрямую через хост.
managed_bookmarks:
  - toplevel_name: "Управляемые"
  - name: "ДЕМО read-only"
    children:
      - name: "Тут ничего нельзя изменить"
        url: https://example.com/demo/readonly
      - name: "Папка второго уровня"
        children:
          - name: "Папка третьего уровня"
            children:
              - name: "Ссылка на третьем уровне"
                url: https://example.com/demo/deep
      - name: "Azure DevOps в контейнере digi3"
        url: https://dev.azure.com
        context: digi3

# Демонстрация первого механизма: одна плоская папка на панели, обычные адреса
# без ext+container, заголовки говорят, что с ними можно сделать. Оба демо-ключа
# удаляются одной правкой, когда разница станет ясна; ничего кроме них на эти
# ключи не смотрит.
bookmarks_demo:
  folder: "ДЕМО обычные"
  items:
    - title: "Переименуй меня, имя останется твоим"
      url: https://example.com/demo/rename
    - title: "Удали меня, вернусь после перезапуска"
      url: https://example.com/demo/delete
    - title: "Перетащи меня в другую папку, останусь там"
      url: https://example.com/demo/move

# Work contexts. One name drags everything else along: the section in
# distrobox.ini, the UNIX-socket directory, the host systemd bridge unit, the
# host listener for links handed out of the container, the Zen container, space
# and toolbar folder, and the .desktop entry in the link picker. `socks` is what
# socat listens on at 127.0.0.1 on the host; the same port is baked into the
# generated context-proxy extension.
#
# The name "scratch" is reserved: it is the no-proxy Zen container for links
# that belong to nobody.
#
# `route: true` включает штатный Space Routing браузера: правило "адрес содержит
# имя контекста -> открыть в его спейсе". Спейс привязан к контейнеру, поэтому
# вместе со спейсом приезжает и прокси.
#
# Схема верна ровно настолько, насколько имя контекста является редкой подстрокой
# в адресах, и это не мелочь: правило не подсказывает, а ВЫТАСКИВАЕТ ссылку.
# `personal` поэтому без флага -- слово встречается в обычных адресах
# (github.com/settings/personal-access-tokens и подобных). Общие домены Microsoft
# правилами не покрываются никогда, по той же причине, по которой на них нельзя
# ставить правила Multi-Account Containers -- см. docs/isolation-links.md,
# раздел «Правило "Always Open This Site in…"».
contexts:
  - name: digi3
    socks: 11081
    route: true
  - name: stellium
    socks: 11082
    route: true
  - name: personal
    socks: 11083

# What Syncthing keeps in step between machines. One entry is one Syncthing
# folder; `id` is what has to be typed identically on the phone, so it is
# spelled out here rather than left to the random generator.
#
# `devices` names participants by logical name; the ID behind each name lives in
# ~/.config/chezmoi/chezmoi.toml, per machine, because this repository is public
# and a device ID is a stable identifier of a box that exists.
#
# A folder is only created on the machines listed in its own `devices`: the
# laptop is not in `camera`, so no empty camera folder appears there.
#
# `path` is relative to the home directory. `type` is Syncthing's own vocabulary:
# sendreceive is a two-way folder, receiveonly accepts changes but never sends
# its own -- which is what makes `camera` an inbox one can empty by hand without
# the phone noticing.
syncthing:
  folders:
    - id: kb
      label: "Knowledge base"
      path: Documents/Notes/kb
      type: sendreceive
      devices: [desktop, laptop]
      versioning: staggered

    - id: personal
      label: "Personal vault"
      path: Documents/Notes/personal
      type: sendreceive
      devices: [desktop, laptop, phone]
      versioning: staggered
      # Obsidian rewrites this file on every tab switch, which on two open
      # machines is a conflict a day. The rest of .obsidian/ -- plugins, themes,
      # settings -- is exactly why the vault is shared, so it stays.
      ignore:
        - ".obsidian/workspace*.json"

    - id: kb-archive
      label: "Knowledge base archive"
      path: Documents/Notes/kb-archive
      type: sendreceive
      devices: [desktop, laptop]
      versioning: none

    # An inbox, not an archive. Photos are carried out of here into permanent
    # storage by hand; receiveonly is what lets that happen without the deletion
    # travelling back to the phone.
    - id: camera
      label: "Phone camera inbox"
      path: Pictures/Camera
      type: receiveonly
      devices: [desktop, phone]
      versioning: none

features:
  # ---------------------------------------------------------------- base ---
  - key: core
    label: "Base utilities"
    scope: both
    always: true
    pacman:
      - base-devel
      - bc
      - diffutils
      - git
      - inetutils
      - less
      - lsof
      - man-db
      - man-pages
      - mtr
      - openssh
      - pigz
      - rsync
      - sudo
      - tcpdump
      - time
      - traceroute
      - tree
      - unzip
      - wget
      - zip

  - key: shell
    label: "Shell: starship, eza, bat, fzf, zoxide, ripgrep, fd"
    scope: both
    always: true
    pacman:
      - bat
      - btop
      - eza
      - fd
      - fzf
      - lazygit
      - ripgrep
      - starship
      - zoxide

  # Packages that are only useful inside distrobox: locale-gen for container
  # locales, xauth for X11 forwarding to the host, nss-mdns to resolve .local,
  # and sox/mesa/vte-common for applications exported back to the host.
  #
  # microsocks and socat publish this container's egress to the host browser
  # over a UNIX socket, which is how a Zen container gets its own network
  # without the browser living in here. nftables is there for the opt-in
  # kill-switch and does nothing until that feature is selected.
  - key: container-base
    label: "Container plumbing"
    scope: container
    always: true
    pacman:
      - alsa-plugins
      - glibc-locales
      - mesa
      - microsocks
      - nftables
      - nss-mdns
      - socat
      - sox
      - vte-common
      - words
      - xorg-xauth

  # Host essentials that are not the desktop but without which a bare machine
  # is unusable. Note that 30-system enables NetworkManager.service and
  # bluetooth.service: without the packages below those `systemctl enable`
  # calls fail, and `set -e` takes the whole script down with them.
  - key: host-base
    label: "Host essentials: network, Bluetooth, firewall, zram"
    scope: host
    always: true
    pacman:
      - bluez
      - bluez-utils
      # chezmoi installs itself so that later updates come from pacman rather
      # than the copy install.sh drops in ~/.local/bin.
      - chezmoi
      # jq builds the ext+container: URIs in /usr/local/bin/zen-open: it is the
      # only tool here that URL-encodes a whole URL correctly, and a URL of its
      # own '&' would otherwise truncate the hand-off.
      - jq
      - networkmanager
      # Fallback editor for when the graphical session is broken. neovim is a
      # separate, optional feature; something has to exist regardless.
      - nano
      - smartmontools
      # The host half of the browser proxy: one socat per work context,
      # republishing that container's UNIX socket on a loopback port.
      - socat
      - ufw
      - wpa_supplicant
      # xdg-open, used by anything that opens a link or a file by MIME type.
      - xdg-utils
      - zram-generator

  # -------------------------------------------------------------- desktop ---
  # Host only and unconditional: without this there is nothing to log into on
  # a bare machine. The Nerd font is not optional -- without it starship and
  # `eza --icons` render tofu boxes.
  - key: desktop
    label: "Desktop: niri + DankMaterialShell"
    scope: host
    always: true
    pacman:
      - brightnessctl
      # Optional dependencies that DankMaterialShell actually reaches for --
      # see `pacman -Qi dms-shell`. Without them the shell still starts, but
      # widgets silently do nothing:
      #   cava            audio visualiser
      #   i2c-tools       brightness control on external monitors
      #   kimageformats   extra image formats for the wallpaper picker
      #   qt6ct           Qt6 application theming
      #   qt6-multimedia  sound effects
      #   tuned-ppd       provides power-profiles-daemon, the power profile switch
      - cava
      - dms-shell-niri
      # The terminal. Ghostty over a daemon-style terminal on purpose: with
      # gtk-single-instance=false (set in its config) every window is its own
      # process, so five busy agents in five windows cannot starve each other.
      - ghostty
      - gst-plugin-pipewire
      - i2c-tools
      - kimageformats
      - matugen
      - mesa
      - niri
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
      - pipewire
      - pipewire-alsa
      - pipewire-jack
      - pipewire-pulse
      - polkit
      - qt6-multimedia
      - qt6ct
      - quickshell
      - sddm
      - ttf-jetbrains-mono-nerd
      - tuned-ppd
      - vulkan-intel
      - vulkan-radeon
      - wireplumber
      - wl-clipboard
      - wtype
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xwayland-satellite

  # Tailscale is unconditional on hosts: it is how the user's machines reach
  # each other (desktop <-> laptop <-> phone), so a box without it is
  # unreachable. The daemon lives on the host; containers share its network.
  - key: tailscale
    label: "Tailscale VPN"
    scope: host
    always: true
    pacman:
      - tailscale

  # distrobox is unconditional: containers are part of the workflow, not an
  # optional extra.
  - key: distrobox
    label: "distrobox + podman"
    scope: host
    always: true
    pacman:
      - distrobox
      - podman

  # ---------------------------------------------------------------- asked ---
  # Two features rather than one with a sub-choice: the checklist is already
  # multi-select, so ticking both is the ordinary answer and not a workaround.
  #
  # herdr knows that the thing in a pane is a coding agent and shows its state,
  # which is the whole reason it is here. It is a 0.x project, so tmux stays
  # beside it as the way back rather than being deleted. Neither is `always`:
  # which multiplexer runs is a preference, not a property of the machine.
  - key: herdr
    label: "herdr: agent-aware multiplexer (primary)"
    scope: both
    default: true
    aur:
      - herdr-bin

  - key: tmux
    label: "tmux (fallback multiplexer)"
    scope: both
    default: true
    pacman:
      - tmux

  - key: neovim
    label: "Neovim + LSP, treesitter"
    scope: both
    default: true
    pacman:
      - neovim
      - tree-sitter-cli

  - key: node
    label: "Node.js + npm"
    scope: both
    default: true
    pacman:
      - nodejs
      - npm

  - key: vscode
    label: "VS Code + extensions from extensions.txt"
    scope: both
    aur:
      - visual-studio-code-bin

  - key: browsers
    label: "Firefox + Chromium"
    scope: host
    default: true
    pacman:
      - chromium
      - firefox

  # The browser for work contexts, and the reason there is one browser process
  # instead of three. Zen shows only the current workspace's tabs in the
  # sidebar, and a workspace is bound to a Firefox container, which is what
  # carries the per-context proxy and cookie jar. always: true because the
  # whole context-isolation setup is built on it.
  #
  # Junction is the link picker: it becomes the default https handler, so a
  # link opened from a host document asks which context it belongs to instead
  # of silently landing in whichever one was last focused.
  - key: zen
    label: "Zen browser + Junction link picker"
    scope: host
    always: true
    pacman:
      - junction
    aur:
      - zen-browser-bin

  # cups-pk-helper is also what lets DankMaterialShell manage printers from
  # its own UI, so it belongs with the printing stack rather than the desktop.
  - key: printing
    label: "Printing (CUPS)"
    scope: host
    default: true
    pacman:
      - cups
      - cups-pk-helper
      - system-config-printer

  # The one feature with no reason to exist in a container: the daemon lives
  # on the host anyway.
  - key: docker
    label: "Docker + lazydocker"
    scope: host
    pacman:
      - docker
      - docker-buildx
      - docker-compose
      - lazydocker

  # The login screen. greetd runs the DMS greeter, which is the desktop shell
  # itself rather than a theme that resembles it: it reads the same
  # settings.json the running session does, which is what genuinely cannot
  # drift out of step. The QML is not literally shared, though -- the greeter
  # ships in its own greetd-dms-greeter-git package, separate from the
  # session's dms-shell, on its own update path (see README): the same
  # upstream project installed twice, not one copy running both places.
  #
  # Not always: which login screen a machine has is a preference, the same way
  # the multiplexer is, and always would drag a -git AUR package onto every
  # machine. That package builds from source, and a failed build takes
  # 20-packages down with the whole apply -- loudly, and before anything has
  # been switched over, but down all the same.
  #
  # sddm stays in `desktop` and stays enabled by 30-system: it is the fallback
  # this switch falls back TO, and `dms greeter uninstall` restores it.
  - key: greeter
    label: "Login screen: DMS greeter on greetd"
    scope: host
    default: true
    pacman:
      - greetd
    aur:
      - greetd-dms-greeter-git

  - key: go
    label: "Go"
    scope: both
    pacman:
      - go

  - key: dotnet
    label: ".NET SDK + ASP.NET, freetds, devtunnel"
    scope: both
    default: true
    pacman:
      - aspnet-runtime
      - aspnet-targeting-pack
      - dotnet-sdk
      - freetds
    aur:
      # Not `devtunnel`: no such package in the AUR any more, which is what the
      # old install script tripped over.
      - devtunnel-cli-bin
    dotnet:
      - dotnet-ef
      - csharpier
      - dotnet-outdated-tool

  - key: rider
    label: "JetBrains Rider"
    scope: both
    default: true
    needs: [dotnet]
    aur:
      - rider

  # Databases themselves run in containers (see docker); these are the
  # clients. DBeaver rather than DataGrip because Rider bundles the same
  # database tooling anyway -- DBeaver is the free universal fallback.
  - key: db-tools
    label: "DB clients: DBeaver (GUI), lazysql, usql, sqlcmd (TUI)"
    scope: both
    default: true
    pacman:
      - dbeaver
    aur:
      - go-sqlcmd
      - lazysql-bin
      - usql-bin

  - key: api-tools
    label: "API clients: Bruno (GUI), posting (TUI)"
    scope: both
    default: true
    aur:
      - bruno-bin
      - posting

  # Three Bitwarden clients on purpose: the desktop app for humans, rbw for
  # the terminal (agent daemon + pinentry, no master password in shell
  # history), bws for LLM agents -- a Secrets Manager machine-account token
  # scoped to a dev project, so Claude/Codex can read API keys but can never
  # touch the personal vault.
  - key: bitwarden
    label: "Passwords: Bitwarden + rbw (terminal) + bws (agent secrets)"
    scope: both
    default: true
    pacman:
      - bitwarden
      - rbw
    aur:
      - bws-bin

  - key: claude
    label: "Claude Code CLI"
    scope: both
    default: true
    needs: [node]
    npm:
      - "@anthropic-ai/claude-code"

  - key: codex
    label: "OpenAI Codex CLI"
    scope: both
    needs: [node]
    npm:
      - "@openai/codex"

  - key: gh
    label: "GitHub CLI"
    scope: both
    default: true
    pacman:
      - github-cli

  - key: azure
    label: "Azure CLI + azd"
    scope: both
    pacman:
      - azure-cli

  - key: teams
    label: "Teams for Linux"
    scope: both
    aur:
      - teams-for-linux

  - key: ziti
    label: "OpenZiti edge tunnel"
    scope: both
    aur:
      - ziti-edge-tunnel

  # Egress lock for a container that has a VPN. Off by default and deliberately
  # so: with no tunnel to allow, a default-drop output chain takes the whole
  # network with it. Turn it on in the container that gets a VPN
  # (chezmoi init --prompt inside it), fill /etc/killswitch.conf, done.
  #
  # It restores a guarantee the old three-browser layout had for free: a
  # request that ends up in the wrong context must die rather than leave
  # through the host.
  - key: killswitch
    label: "Kill-switch: drop egress that bypasses the VPN"
    scope: container

  # Handy is an offline speech-to-text app. The Whisper inside it reaches the
  # GPU through Vulkan rather than CUDA, so a card only needs its regular
  # driver and ICD. openblas is an undeclared dependency of handy-bin 0.9.4.
  #
  # Which Whisper, and the seed that keeps its punctuation from wandering, are
  # pinned by 44-handy-settings rather than left to whatever was picked in the
  # UI: both were measured, and neither survives a reinstall on its own.
  - key: voice
    label: "Voice input (Handy, offline)"
    scope: host
    pacman:
      - openblas
    aur:
      - handy-bin

  # Syncthing keeps the note vaults identical across machines and pulls phone
  # photos in. Host only: containers already see the host's home tree, so a
  # daemon in each of them would move the same bytes a fourth time and need an
  # identity and a port of its own.
  #
  # curl is listed explicitly even though git and pacman drag it in anyway: the
  # configuration script talks to the daemon over REST, and a dependency that
  # arrives by accident is a dependency that can leave by accident.
  - key: syncthing
    label: "Syncthing: notes and phone media sync"
    scope: host
    default: true
    pacman:
      - curl
      - syncthing

  - key: obsidian
    label: "Obsidian (notes editor)"
    scope: host
    default: true
    pacman:
      - obsidian

  # No packages -- this feature only gates the images under home/Pictures/
  # wallpapers/ (see .chezmoiignore). Separate from `desktop` so a future
  # machine can skip 7 MB of jpgs without losing the desktop itself.
  - key: wallpapers
    label: "Wallpapers into ~/Pictures/wallpapers"
    scope: host
    default: true

  - key: bluetooth-fix
    label: "Fix for cheap USB Bluetooth dongle (10d7:b012)"
    scope: host
