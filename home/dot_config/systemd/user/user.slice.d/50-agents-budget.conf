# Total memory budget for "the machinery": every rootless podman container
# plus agent sessions started on the host.
#
# Why user.slice and not a dedicated agents.slice: rootless podman parents
# every libpod-*.scope under the user manager's user.slice and there is no
# global knob to move it -- containers.conf has no cgroup_parent option, only
# per-container --cgroup-parent exists, and the Aspire-created containers
# (SQL Server, Azurite) come through podman.socket where no distrobox flag
# could reach them. So the budget goes where the containers already are, and
# the host-side claude/codex wrappers in .bashrc put their sessions under
# user-agents.slice, a child of this same umbrella. Nothing else runs here:
# terminals live in app.slice, browsers in browser.slice.
#
# Same two-stage design as browser.slice: past MemoryHigh the kernel throttles
# and reclaims this subtree only (slow but alive, sleeping pages go to zram --
# which is why this needs the ram/2 zram from 30-system to degrade gracefully);
# past MemoryMax the OOM killer takes the fattest process INSIDE the subtree,
# the rest of the machine never notices. Observed peak before any cap existed:
# 22.8G on 2026-08-02, the swap-exhaustion thrash that froze the desktop.
[Slice]
MemoryHigh=12G
MemoryMax=16G
