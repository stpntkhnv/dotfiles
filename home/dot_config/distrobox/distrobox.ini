# NOTE: distrobox-assemble treats every [section] as a container, including
# [base]. Always pass --name <containername>, otherwise a redundant "base"
# container will be created alongside the real one.
#
#   distrobox assemble create --name digi3 --file ~/.config/distrobox/distrobox.ini
#
# Inside a container the setup is driven by the same one-line installer as on
# the host: it detects that it is in a container by itself and only offers the
# features that make sense there.

[base]
image=docker.io/library/archlinux:latest
pull=false
init=true
nvidia=false
root=false
entry=true
start_now=false
replace=false

unshare_netns=true
unshare_process=false
unshare_ipc=false
unshare_devsys=false
unshare_groups=false
unshare_all=false

additional_packages="pass"
# Hard memory lid on the whole container -- everything inside (browsers,
# builds, agents) shares it, so three containers can never gang up on the
# host. Rootless limits need cgroups v2 with memory delegated to the user
# slice; systemd on Arch does that out of the box. Takes effect at
# container (re)creation, not on a live one.
additional_flags="--memory=8g"
pre_init_hooks=""
exported_apps=""
exported_bins=""
exported_bins_path="~/.local/bin"

[digi3]
include=base
home=/home/stsiapan/homes/digi3

[stellium]
include=base
home=/home/stsiapan/homes/stellium

[personal]
include=base
home=/home/stsiapan/homes/personal
